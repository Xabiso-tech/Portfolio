<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Contact  | AutoVault</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black shadow-lg">

        <div class="container">
            <a class="navbar-brand fw-bold fs-3"
               href="index.html">
                <span class="text-danger">Auto</span>Vault
            </a>
        </div>
    </nav>

    <!-- CONTACT FORM -->
    <div class="container py-5">
        <div class="card border-0 shadow-lg p-5">
        <h1 class="display-5 fw-bold mb-4 text-center">
            Contact AutoVault!
        </h1>

        <form>
            <div class="mb-3">
                <label class="form-label">
                    Full Name
                </label>

                <input type="text"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Email Address
                </label>

                <input type="email"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Message
                </label>

                <textarea class="form-control"
                          rows="5"></textarea>
            </div>

            <button class="btn btn-danger btn-lg w-100">
                Send Message...
            </button>
        </form>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-4 mt-auto">

        <p class="mb-0">
            © 2026 AutoVault
        </p>
    </footer>

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
